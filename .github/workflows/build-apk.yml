
name: Build Blue Big Fish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blue-big-fish-v12-android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q blue-big-fish-v12-android-project.zip -d source
          find source \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find source \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "source" ]; then
            echo "Android project directory not found"
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-v12-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
