
name: Build Blue Big Fish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blue-big-fish-v12-android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q blue-big-fish-v12-android-project.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          echo "Project directory: $PROJECT_DIR"
          cat > "$RUNNER_TEMP/kotlin-jvm-target.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "1.8"
                  }
              }
          }
          EOF
          cd "$PROJECT_DIR"
          gradle --no-daemon -I "$RUNNER_TEMP/kotlin-jvm-target.gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-v12-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
